<!-- JS for simple interactions -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!window.famsApi.hasServerConfigured()) {
                window.location.href = '../server_setup/code.html';
                return;
            }
            if (window.famsApi.isAuthenticated()) {
                window.location.href = '../live_floor_dashboard/code.html';
                return;
            }

            // Handle floating labels for inputs that might be pre-filled
            const inputs = document.querySelectorAll('.input-glass');
            inputs.forEach(input => {
                // Initial check
                if (input.value) {
                    input.setAttribute('valid', 'true');
                }
                
                // Check on input
                input.addEventListener('input', () => {
                    if (input.value) {
                        input.setAttribute('valid', 'true');
                    } else {
                        input.removeAttribute('valid');
                    }
                });
            });

            // Password visibility toggle
            const eyeIconBtn = document.querySelector('input[type="password"]').nextElementSibling.nextElementSibling;
            if(eyeIconBtn && eyeIconBtn.tagName === 'BUTTON') {
                 const icon = eyeIconBtn.querySelector('.material-symbols-outlined');
                 const input = document.getElementById('password');
                 
                 eyeIconBtn.addEventListener('click', () => {
                     if(input.type === 'password') {
                         input.type = 'text';
                         icon.textContent = 'visibility_off';
                     } else {
                         input.type = 'password';
                         icon.textContent = 'visibility';
                     }
                 });
            }

            const serverLabel = document.getElementById('server-label');
            if (serverLabel) serverLabel.textContent = window.famsApi.getServerUrl().replace(/^https?:\/\//, '');

            // Handle Sign In Action
            const loginBtn = document.getElementById('login-btn');
            const errorMsg = document.getElementById('error-msg');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');

            loginBtn.addEventListener('click', async () => {
                const username = usernameInput.value.trim();
                const password = passwordInput.value;

                if (!username || !password) {
                    showError('Please enter both username and password.');
                    return;
                }

                try {
                    loginBtn.disabled = true;
                    loginBtn.innerHTML = 'Signing In... <span class="material-symbols-outlined text-[18px] animate-spin">sync</span>';
                    errorMsg.classList.add('hidden');

                    const response = await window.famsApi.loginSupervisor(username, password);
                    console.log('Login success:', response);
                    
                    // Redirect to dashboard
                    window.location.href = '../live_floor_dashboard/code.html';
                } catch (err) {
                    console.error('Login error:', err);
                    showError(err.message || 'Invalid username or password.');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = 'Sign In <span class="material-symbols-outlined text-[18px]">arrow_forward</span>';
                }
            });

            function showError(msg) {
                errorMsg.textContent = msg;
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
