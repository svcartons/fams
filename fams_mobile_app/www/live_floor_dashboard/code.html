<body class="text-on-surface font-body-md min-h-screen flex flex-col pt-16 pb-28 md:hidden">
<div id="connection-banner" class="hidden fixed top-16 left-0 right-0 z-40 bg-error-container/90 text-on-error-container text-xs text-center py-1.5 px-3"></div>
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface-container/80 dark:bg-surface-container/80 backdrop-blur-md border-b border-white/10 flex justify-between items-center px-md h-16">
<h1 class="font-headline-md text-headline-md font-bold text-primary">Live Floor</h1>
<div class="flex items-center gap-sm">
<div class="glass-panel px-3 py-1 rounded-full text-sm font-label-md text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">calendar_today</span>
                <span id="header-date">Oct 24, 2023</span>
            </div>
<img alt="Supervisor Profile" class="w-10 h-10 rounded-full border border-primary/30 object-cover" src="https://lh3.googleusercontent.com/aida/ADBb0uiNBKmIYh9EAtzgssP2iZLK8ttbgejMhJIpA0ZeSQaqjSXowrpU0cJQGgVkZq5YoaaKqMTia412Jy7TwXjdUm9JkyLZxZhC_QBgBB9SoQ6AenpJ8SNiGXMyXQcA18HuLMKi_m8tN9dv7O6ukuTVnxbE7ut1hbNGjwuS_k0Hw2q3jcGxDXuHky3Nf8Sp2NirUeCte59Y_ig9dqLcoNUb3Fz6eR0dQAAqbTBb0kvUzZjohWwIWR9Ybsenk_E"/>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-md py-4 space-y-lg overflow-y-auto">
<!-- Stats Grid Bento -->
<section class="grid grid-cols-2 gap-sm">
<!-- Present -->
<div class="glass-panel rounded-xl p-md border-l-4 border-l-secondary flex flex-col justify-between h-24">
<span class="font-label-md text-label-md text-on-surface-variant">Present</span>
<div id="stats-present" class="font-headline-lg text-headline-lg text-on-surface">--</div>
</div>
<!-- On Break -->
<div class="glass-panel rounded-xl p-md border-l-4 border-l-[#FFC107] flex flex-col justify-between h-24">
<span class="font-label-md text-label-md text-on-surface-variant">On Break</span>
<div id="stats-break" class="font-headline-lg text-headline-lg text-on-surface">--</div>
</div>
<!-- Absent -->
<div class="glass-panel rounded-xl p-md border-l-4 border-l-error flex flex-col justify-between h-24">
<span class="font-label-md text-label-md text-on-surface-variant">Absent</span>
<div id="stats-absent" class="font-headline-lg text-headline-lg text-on-surface">--</div>
</div>
<!-- Total -->
<div class="glass-panel rounded-xl p-md border-l-4 border-l-primary flex flex-col justify-between h-24">
<span class="font-label-md text-label-md text-on-surface-variant">Total</span>
<div id="stats-total" class="font-headline-lg text-headline-lg text-primary">--</div>
</div>
</section>
<!-- Filters -->
<section id="filter-buttons" class="flex overflow-x-auto gap-sm hide-scrollbar pb-1">
<button data-filter="all" class="filter-btn bg-primary text-on-primary-fixed font-label-md text-label-md px-4 py-2 rounded-full whitespace-nowrap flex-shrink-0">All</button>
<button data-filter="present" class="filter-btn glass-panel text-on-surface-variant font-label-md text-label-md px-4 py-2 rounded-full whitespace-nowrap flex-shrink-0 hover:text-on-surface">Present</button>
<button data-filter="break" class="filter-btn glass-panel text-on-surface-variant font-label-md text-label-md px-4 py-2 rounded-full whitespace-nowrap flex-shrink-0 hover:text-on-surface">On Break</button>
<button data-filter="absent" class="filter-btn glass-panel text-on-surface-variant font-label-md text-label-md px-4 py-2 rounded-full whitespace-nowrap flex-shrink-0 hover:text-on-surface">Absent</button>
</section>
<!-- Worker List -->
<section id="worker-list-container" class="space-y-sm">
<div class="text-center text-on-surface-variant py-md">Loading workers...</div>
</section>
</main>
<div id="mobile-nav-root"></div>
<script>
    let allAttendance = [];
    let currentFilter = 'all';

    document.addEventListener('DOMContentLoaded', () => {
        if (!window.famsApi.requireAuth()) return;

        const user = window.famsApi.getSupervisorUser();
        const terminal = window.famsApi.getTerminalInfo();
        const serverLabel = window.famsApi.getServerUrl().replace(/^https?:\/\//, '');

        // Set dynamic date in header
        const dateSpan = document.getElementById('header-date');
        if (dateSpan) {
            const options = { month: 'short', day: 'numeric', year: 'numeric' };
            dateSpan.textContent = new Date().toLocaleDateString('en-US', options);
        }

        // Fetch Stats and Worker List immediately
        window.famsNav.mountMobileNav('live');
        window.famsApi.refreshWorkerCache().catch(() => {});
        loadDashboardData();

        // Refresh every 10 seconds for real-time monitoring
        setInterval(loadDashboardData, 10000);

        // Filter button listeners
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const filter = e.target.getAttribute('data-filter');
                currentFilter = filter;
                
                // Toggle active styles
                filterBtns.forEach(b => {
                    b.className = 'filter-btn glass-panel text-on-surface-variant font-label-md text-label-md px-4 py-2 rounded-full whitespace-nowrap flex-shrink-0 hover:text-on-surface';
                });
                e.target.className = 'filter-btn bg-primary text-on-primary-fixed font-label-md text-label-md px-4 py-2 rounded-full whitespace-nowrap flex-shrink-0';

                // Re-render filtered list
                applyFilterAndRender();
            });
        });

    });

    function showConnectionError(msg) {
        const banner = document.getElementById('connection-banner');
        if (!banner) return;
        banner.textContent = msg;
        banner.classList.remove('hidden');
    }

    function hideConnectionError() {
        const banner = document.getElementById('connection-banner');
        if (banner) banner.classList.add('hidden');
    }

    async function loadDashboardData() {
        try {
            hideConnectionError();
            // Get stats
            const stats = await window.famsApi.getDashboardStats();
            document.getElementById('stats-present').textContent = stats.presentCount ?? 0;
            document.getElementById('stats-break').textContent = stats.breakCount ?? 0;
            document.getElementById('stats-absent').textContent = stats.absentCount ?? 0;
            document.getElementById('stats-total').textContent = stats.totalWorkers ?? 0;

            // Get live attendance
            allAttendance = await window.famsApi.getLiveAttendance();
            applyFilterAndRender();
        } catch (err) {
            console.error('Failed to load dashboard data:', err);
            showConnectionError(err.message || 'Cannot reach FAMS server');
            document.getElementById('worker-list-container').innerHTML =
                `<div class="text-center text-on-surface-variant py-md">Unable to load data. Check server at ${window.famsApi.getServerUrl().replace(/^https?:\/\//, '')}.</div>`;
        }
    }

    function applyFilterAndRender() {
        let filtered = allAttendance;
        if (currentFilter === 'present') {
            filtered = allAttendance.filter(w => w.status === 'present' || w.status === 'in');
        } else if (currentFilter === 'break') {
            filtered = allAttendance.filter(w => w.status === 'break');
        } else if (currentFilter === 'absent') {
            filtered = allAttendance.filter(w => w.status === 'absent');
        }
        renderWorkerList(filtered);
    }

    function renderWorkerList(attendanceList) {
        const container = document.getElementById('worker-list-container');
        if (!attendanceList || attendanceList.length === 0) {
            container.innerHTML = `<div class="text-center text-on-surface-variant py-md">No workers match this status right now.</div>`;
            return;
        }

        let html = '';
        attendanceList.forEach(worker => {
            // Determine status badge class and text
            let statusBadge = '';
            let borderClass = 'border-secondary';
            let statusText = 'Checked In';
            
            if (worker.status === 'present' || worker.status === 'in') {
                statusBadge = 'bg-secondary-container/30 border-secondary/50 text-secondary';
                borderClass = 'border-secondary';
                statusText = 'Checked In';
            } else if (worker.status === 'break') {
                statusBadge = 'bg-[#FFC107]/20 border-[#FFC107]/50 text-[#FFC107]';
                borderClass = 'border-[#FFC107]';
                statusText = 'Tea Break';
            } else {
                statusBadge = 'bg-error-container/30 border-error/50 text-error';
                borderClass = 'border-error';
                statusText = 'Absent';
            }

            // Duration calculation or display WFH etc.
            let durationText = worker.department || 'Production';
            if (worker.todayHours !== undefined) {
                durationText += ` • ${worker.todayHours}h`;
            }

            const avatarUrl = worker.avatarUrl || worker.avatarPhoto || null;
            const avatarHtml = avatarUrl
                ? `<img alt="${worker.name}" class="w-full h-full rounded-full object-cover ${worker.status === 'absent' ? 'grayscale' : ''}" src="${avatarUrl}"/>`
                : `<div class="w-full h-full rounded-full bg-surface-container-high flex items-center justify-center text-primary font-bold text-sm">${window.famsUi.initialsAvatar(worker.name)}</div>`;

            html += `
            <div class="glass-panel rounded-xl p-3 flex items-center justify-between ${worker.status === 'absent' ? 'opacity-70' : ''}">
                <div class="flex items-center gap-3">
                    <div class="relative w-12 h-12">
                        <div class="absolute inset-0 rounded-full border-2 ${borderClass} p-[2px]">
                            ${avatarHtml}
                        </div>
                    </div>
                    <div>
                        <div class="font-label-md text-label-md text-on-surface font-bold">${worker.name}</div>
                        <div class="text-xs text-on-surface-variant">${durationText}</div>
                    </div>
                </div>
                <div class="px-3 py-1 rounded-full ${statusBadge} font-label-md text-xs whitespace-nowrap">
                    ${statusText}
                </div>
            </div>
            `;
        });

        container.innerHTML = html;
    }
</script>
