<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#001019"/>
  <title>FAMS Kiosk</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Inter, sans-serif;
      background: #001019;
      color: #c7ebff;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      background: rgba(0,28,40,.85);
    }
    .top h1 { font-size: 1rem; font-weight: 600; color: #6dddff; }
    .badge {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255,113,108,.15);
      border: 1px solid rgba(255,113,108,.35);
      color: #ffa8a3;
    }
    .badge.ok { background: rgba(63,255,139,.12); border-color: rgba(63,255,139,.3); color: #3fff8b; }
    .conn-bar {
      padding: 8px 16px;
      font-size: 12px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .conn-bar.offline { background: rgba(159,5,25,.35); color: #ffa8a3; }
    .conn-bar.online { background: rgba(0,109,53,.25); color: #3fff8b; }
    .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; gap: 16px; }
    .video-wrap {
      position: relative;
      width: min(100%, 360px);
      aspect-ratio: 3/4;
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid rgba(109,221,255,.25);
      background: #000;
      box-shadow: 0 8px 32px rgba(0,0,0,.4);
    }
    #video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .scan-ring {
      position: absolute; inset: 12%;
      border: 2px solid rgba(109,221,255,.35);
      border-radius: 24%;
      pointer-events: none;
    }
    .status {
      text-align: center;
      font-size: 1.125rem;
      font-weight: 500;
      min-height: 1.5em;
      color: #84b1ca;
    }
    .success-panel {
      display: none;
      text-align: center;
      padding: 20px;
      border-radius: 16px;
      background: rgba(0,109,53,.35);
      border: 1px solid rgba(63,255,139,.4);
      max-width: 360px;
      width: 100%;
    }
    .success-panel.show { display: block; }
    .success-panel h2 { font-size: 1.5rem; color: #3fff8b; margin-bottom: 4px; }
    .success-panel .code { font-family: monospace; font-size: 12px; color: #84b1ca; }
    .success-panel .time { font-size: 14px; margin-top: 8px; color: #c7ebff; }
    .success-panel .sync-note { font-size: 12px; margin-top: 8px; color: #84b1ca; }
    .footer {
      padding: 10px 16px 16px;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      font-size: 11px;
      color: #4e7b92;
    }
    .footer button {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      color: #84b1ca;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
    }
    .loading overlay {
      position: fixed; inset: 0;
      background: #001019;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 100;
    }
    .loading.hidden { display: none; }
    .spinner {
      width: 32px; height: 32px;
      border: 2px solid rgba(109,221,255,.2);
      border-top-color: #6dddff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script src="../js/offlineQueue.js"></script>
  <script src="../js/faceCache.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/syncManager.js"></script>
  <script src="../vendor/face-api.min.js"></script>
  <script src="../js/kioskEngine.js"></script>
</head>
<body>
  <div id="boot" class="loading">
    <div class="spinner"></div>
    <p id="boot-msg">Loading face recognition…</p>
  </div>

  <div id="conn-bar" class="conn-bar offline">Checking server connection…</div>
  <header class="top">
    <h1>FAMS Kiosk</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <span id="faces-badge" class="badge ok">— faces</span>
      <span id="queue-badge" class="badge">0 pending sync</span>
    </div>
  </header>

  <div class="main">
    <div class="video-wrap">
      <video id="video" autoplay playsinline muted></video>
      <div class="scan-ring"></div>
    </div>
    <p id="status" class="status">Face the camera</p>
    <div id="success" class="success-panel">
      <h2 id="success-name">—</h2>
      <p id="success-code" class="code">—</p>
      <p id="success-time" class="time">—</p>
      <p id="success-sync" class="sync-note">—</p>
    </div>
  </div>

  <footer class="footer">
    <span id="terminal-label">Terminal</span>
    <button type="button" id="btn-sync">Sync now</button>
    <button type="button" id="btn-refresh-faces">Refresh faces</button>
    <button type="button" id="btn-setup">Setup</button>
  </footer>

  <script>
    let videoStream = null;

    function updateQueueBadge() {
      const n = window.famsApi.getPendingCount();
      const el = document.getElementById('queue-badge');
      el.textContent = n ? `${n} pending sync` : 'All synced';
      el.className = n ? 'badge' : 'badge ok';
    }

    function showSuccess(data) {
      const panel = document.getElementById('success');
      document.getElementById('success-name').textContent = data.workerName;
      document.getElementById('success-code').textContent = data.employeeCode;
      document.getElementById('success-time').textContent = `Recorded at ${data.formattedTime}`;
      document.getElementById('success-sync').textContent = data.syncedNow
        ? 'Sent to server immediately'
        : `Saved on device · ${data.pendingTotal} waiting to sync to server`;
      panel.classList.add('show');
      setTimeout(() => panel.classList.remove('show'), 4000);
      updateQueueBadge();
    }

    async function startCamera() {
      const video = document.getElementById('video');
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false,
        });
        video.srcObject = videoStream;
        await video.play();
      } catch (err) {
        document.getElementById('status').textContent = 'Camera access required for kiosk';
        throw err;
      }
    }

    function setConnectionStatus(online, detail) {
      const bar = document.getElementById('conn-bar');
      if (online) {
        bar.className = 'conn-bar online';
        bar.textContent = `Connected to server · ${detail?.faceCount ?? '—'} faces · ${window.famsApi.getServerUrl().replace(/^https?:\/\//, '')}`;
      } else {
        bar.className = 'conn-bar offline';
        bar.textContent = detail?.error || 'Offline — scans saved on phone, will upload when server is reachable';
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (!window.famsApi.hasServerConfigured()) {
        window.location.href = '../server_setup/code.html';
        return;
      }
      if (!window.famsApi.isPaired()) {
        window.location.href = '../device_pairing_setup_step_2/code.html';
        return;
      }

      const term = window.famsApi.getTerminalInfo();
      document.getElementById('terminal-label').textContent = term.name || 'Mobile terminal';

      updateQueueBadge();
      window.addEventListener('fams-queue-changed', updateQueueBadge);
      window.addEventListener('fams-sync-complete', updateQueueBadge);

      window.famsSync.startSyncManager(20000);
      window.addEventListener('fams-connection-changed', (e) => setConnectionStatus(e.detail?.online, e.detail));
      window.addEventListener('fams-data-pulled', (e) => {
        const n = e.detail?.faceCount ?? 0;
        document.getElementById('faces-badge').textContent = `${n} faces enrolled`;
      });

      try {
        document.getElementById('boot-msg').textContent = 'Loading AI models (offline)…';
        let count = await KioskEngine.initialize('../models');
        document.getElementById('boot-msg').textContent = 'Connecting to laptop server…';
        try {
          await window.famsApi.pullServerData();
          count = await KioskEngine.buildMatcher();
        } catch (pullErr) {
          console.warn('Initial pull failed:', pullErr.message);
          setConnectionStatus(false, { error: pullErr.message });
        }
        document.getElementById('faces-badge').textContent = `${count} faces enrolled`;
        if (count === 0) {
          document.getElementById('boot-msg').textContent = 'No faces on device yet. Fix server IP in Setup, then tap Refresh faces.';
        }
      } catch (err) {
        console.error(err);
        document.getElementById('boot-msg').textContent = err.message || 'Failed to load kiosk';
      }

      document.getElementById('boot').classList.add('hidden');

      await startCamera();

      KioskEngine.startScanning(document.getElementById('video'), {
        onStatus: (state, msg) => {
          document.getElementById('status').textContent = msg;
        },
        onSuccess: (data) => showSuccess(data),
        onError: (msg) => {
          document.getElementById('status').textContent = msg;
        },
      });

      document.getElementById('btn-sync').addEventListener('click', async () => {
        document.getElementById('status').textContent = 'Syncing with server…';
        try {
          const r = await window.famsApi.fullSync();
          const merged = r.push?.merged ?? 0;
          const faces = r.pull?.faceCount ?? 0;
          window.famsUi.showToast(`Pulled ${faces} faces · uploaded ${merged} scans`, 'success');
          const n = await KioskEngine.buildMatcher();
          document.getElementById('faces-badge').textContent = `${n} faces enrolled`;
          updateQueueBadge();
        } catch (e) {
          window.famsUi.showToast(e.message, 'error');
          setConnectionStatus(false, { error: e.message });
        }
        document.getElementById('status').textContent = 'Face the camera';
      });

      document.getElementById('btn-refresh-faces').addEventListener('click', async () => {
        document.getElementById('status').textContent = 'Pulling from server…';
        try {
          const pack = await window.famsApi.pullServerData();
          const n = await KioskEngine.buildMatcher();
          document.getElementById('faces-badge').textContent = `${n} faces enrolled`;
          setConnectionStatus(true, pack);
          window.famsUi.showToast(`Downloaded ${pack.faceCount} faces, ${pack.workerCount} workers`, 'success');
        } catch (e) {
          window.famsUi.showToast(e.message, 'error');
          setConnectionStatus(false, { error: e.message });
        }
        document.getElementById('status').textContent = 'Face the camera';
      });

      document.getElementById('btn-setup').addEventListener('click', () => {
        window.location.href = '../server_setup/code.html';
      });
    });

    window.addEventListener('beforeunload', () => {
      KioskEngine.stopScanning();
      if (videoStream) videoStream.getTracks().forEach(t => t.stop());
    });
  </script>
</body>
</html>
