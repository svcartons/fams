<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>FAMS Mobile — Server Setup</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: '#001019',
            surface: '#001c28',
            primary: '#6dddff',
            'on-surface': '#c7ebff',
            'on-surface-variant': '#84b1ca',
            outline: '#4e7b92',
            error: '#ff716c',
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        },
      },
    };
  </script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <style>
    body { font-family: Inter, system-ui, sans-serif; background: #001019; }
    .glass { background: rgba(0,28,40,.65); border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="min-h-screen text-on-surface flex flex-col items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-16 h-16 mx-auto mb-4 rounded-xl glass flex items-center justify-center">
        <span class="material-symbols-outlined text-primary text-3xl">dns</span>
      </div>
      <h1 class="text-2xl font-bold text-primary">Connect to FAMS Server</h1>
      <p class="text-sm text-on-surface-variant mt-2">Enter the IP address of the machine running the FAMS backend on your factory network.</p>
    </div>

    <div class="glass rounded-2xl p-6 space-y-4">
      <div>
        <label for="server-url" class="block text-sm font-medium text-on-surface-variant mb-2">Server address</label>
        <input id="server-url" type="text" inputmode="url" placeholder="192.168.1.100:3007"
          class="w-full rounded-lg bg-[#001019] border border-outline/50 px-4 py-3 text-on-surface focus:border-primary focus:outline-none"/>
        <p class="text-xs text-on-surface-variant mt-2">Example: <code class="text-primary">192.168.1.100:3007</code> — find this on your laptop with <code class="text-primary">ifconfig</code> / ipconfig. Do not use localhost.</p>
      </div>

      <div id="status" class="hidden text-sm rounded-lg px-3 py-2"></div>

      <button id="test-btn" type="button"
        class="w-full py-3 rounded-xl border border-outline/40 text-on-surface-variant hover:text-on-surface hover:border-primary/50 transition-colors">
        Test connection
      </button>

      <button id="save-btn" type="button"
        class="w-full py-3.5 rounded-xl bg-gradient-to-r from-primary to-[#00c3eb] text-[#004352] font-semibold shadow-lg hover:opacity-90 active:scale-[.98] transition-all">
        Save &amp; continue
      </button>
    </div>

    <p class="text-center text-xs text-on-surface-variant/60 mt-6">You can change this later from any screen via Settings.</p>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const input = document.getElementById('server-url');
      const status = document.getElementById('status');
      const testBtn = document.getElementById('test-btn');
      const saveBtn = document.getElementById('save-btn');

      if (window.famsApi.hasServerConfigured()) {
        input.value = window.famsApi.getServerUrl().replace(/^https?:\/\//, '');
      }

      function showStatus(msg, ok) {
        status.textContent = msg;
        status.className = `text-sm rounded-lg px-3 py-2 ${ok ? 'bg-green-900/30 text-green-300 border border-green-700/40' : 'bg-red-900/30 text-red-300 border border-red-700/40'}`;
        status.classList.remove('hidden');
      }

      testBtn.addEventListener('click', async () => {
        try {
          window.famsApi.setServerUrl(input.value);
          setButtonLoading(testBtn, true);
          const health = await window.famsApi.testConnection();
          showStatus(`Connected — ${health.status || 'OK'}`, true);
        } catch (err) {
          showStatus(err.message, false);
        } finally {
          setButtonLoading(testBtn, false, 'Test connection');
        }
      });

      saveBtn.addEventListener('click', async () => {
        try {
          window.famsApi.setServerUrl(input.value);
          setButtonLoading(saveBtn, true);
          await window.famsApi.testConnection();
          window.famsUi.showToast('Server connected', 'success');
          setTimeout(() => window.famsApi.routeToHome(), 400);
        } catch (err) {
          showStatus(err.message, false);
          setButtonLoading(saveBtn, false, 'Save & continue');
        }
      });
    });
  </script>
</body>
</html>
