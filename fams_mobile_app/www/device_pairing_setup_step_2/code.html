<script>
    document.addEventListener('DOMContentLoaded', () => {
        if (!window.famsApi.hasServerConfigured()) {
            window.location.href = '../server_setup/code.html';
            return;
        }
        if (window.famsApi.isPaired()) {
            window.location.href = '../kiosk/code.html';
            return;
        }

        // Wire back button
        const backBtn = document.getElementById('back-btn');
        if (backBtn) {
            backBtn.addEventListener('click', () => {
                window.location.href = '../supervisor_login/code.html';
            });
        }

        // Handle numeric input typing & autofocus
        const inputs = document.querySelectorAll('#pairing-inputs input');
        
        inputs.forEach((input, index) => {
            // Restrict input to digits only
            input.addEventListener('keypress', (e) => {
                if (!/[0-9]/.test(e.key)) {
                    e.preventDefault();
                }
            });

            input.addEventListener('input', (e) => {
                const val = e.target.value;
                // Double check it's a number
                if (!/^[0-9]$/.test(val) && val !== '') {
                    e.target.value = '';
                    return;
                }

                if (val.length === 1) {
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    } else {
                        // All 6 digits filled! Auto-verify pairing
                        verifyPairingCode();
                    }
                }
            });

            // Focus management on backspace
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace') {
                    if (e.target.value === '') {
                        if (index > 0) {
                            inputs[index - 1].focus();
                            inputs[index - 1].value = ''; // Clear previous input on backspace
                        }
                    } else {
                        e.target.value = '';
                    }
                    e.preventDefault();
                }
            });
        });

        const verifyBtn = document.getElementById('verify-btn');
        verifyBtn.addEventListener('click', verifyPairingCode);

        async function verifyPairingCode() {
            let code = '';
            inputs.forEach(input => code += input.value);
            
            if (code.length !== 6) {
                window.famsUi.showToast('Enter all 6 digits', 'error');
                return;
            }

            const idleHtml = verifyBtn.innerHTML;
            try {
                window.famsUi.setButtonLoading(verifyBtn, true);

                const res = await window.famsApi.pairTerminal(code);
                window.famsUi.showToast(`Paired as ${res.name}`, 'success');
                setTimeout(() => {
                    window.location.href = '../kiosk/code.html';
                }, 600);
            } catch (error) {
                window.famsUi.showToast(error.message || 'Pairing failed', 'error');
                window.famsUi.setButtonLoading(verifyBtn, false, idleHtml);
            }
        }
    });
</script>
