<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#00D4FF",
                        background: "#0A0F1E",
                        surface: "rgba(255, 255, 255, 0.05)",
                        success: "#00E676",
                        error: "#FF3D57",
                        warning: "#FFC107",
                        "status-checked-in": "#00E676",
                        "status-break": "#FFC107",
                        "status-checked-out": "#64748b",
                        "status-absent": "#FF3D57"
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        headline: ["Inter", "sans-serif"],
                        display: ["Inter", "sans-serif"],
                        body: ["Inter", "sans-serif"],
                        label: ["Inter", "sans-serif"],
                        mono: ["JetBrains Mono", "monospace"]
                    },
                    animation: {
                        'scan-line': 'scan 2s linear infinite',
                        'pulse-ring': 'pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'fade-in-success': 'fadeIn 0.5s ease-out forwards'
                    },
                    keyframes: {
                        scan: {
                            '0%': { top: '0%' },
                            '100%': { top: '100%' }
                        },
                        'pulse-ring': {
                            '0%, 100%': { opacity: '1', transform: 'scale(1)' },
                            '50%': { opacity: '0.5', transform: 'scale(1.05)' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0', backdropFilter: 'blur(0px)' },
                            '100%': { opacity: '1', backdropFilter: 'blur(12px)' }
                        }
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #0A0F1E;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            /* Tablet dimensions roughly */
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .kiosk-container {
            width: 100%;
            height: 100%;
            position: relative;
            background-color: #0A0F1E;
            overflow: hidden;
        }

        /* Glassmorphism utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Face Scanner Bracket Corners */
        .bracket {
            position: absolute;
            width: 40px;
            height: 40px;
            border-color: #00D4FF;
        }
        .bracket-tl { top: 0; left: 0; border-top: 4px solid; border-left: 4px solid; border-top-left-radius: 1rem; }
        .bracket-tr { top: 0; right: 0; border-top: 4px solid; border-right: 4px solid; border-top-right-radius: 1rem; }
        .bracket-bl { bottom: 0; left: 0; border-bottom: 4px solid; border-left: 4px solid; border-bottom-left-radius: 1rem; }
        .bracket-br { bottom: 0; right: 0; border-bottom: 4px solid; border-right: 4px solid; border-bottom-right-radius: 1rem; }

    </style>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
</head>

                    avatar: 'https://lh3.googleusercontent.com/aida/ADBb0uiNBKmIYh9EAtzgssP2iZLK8ttbgejMhJIpA0ZeSQaqjSXowrpU0cJQGgVkZq5YoaaKqMTia412Jy7TwXjdUm9JkyLZxZhC_QBgBB9SoQ6AenpJ8SNiGXMyXQcA18HuLMKi_m8tN9dv7O6ukuTVnxbE7ut1hbNGjwuS_k0Hw2q3jcGxDXuHky3Nf8Sp2NirUeCte59Y_ig9dqLcoNUb3Fz6eR0dQAAqbTBb0kvUzZjohWwIWR9Ybsenk_E' 
                }
            ];

            // Dynamically inject employee selector in the header
            const headerContainer = document.querySelector('header');
            if (headerContainer) {
                headerContainer.className = 'w-full pt-8 px-8 flex justify-between items-center z-10';
                
                const selectorWrapper = document.createElement('div');
                selectorWrapper.className = 'relative z-50';
                selectorWrapper.innerHTML = `
                    <select id="worker-selector" class="glass-panel text-white bg-[#0A0F1E]/80 border border-white/10 px-4 py-2 rounded-full text-xs font-semibold focus:outline-none focus:border-primary/50 cursor-pointer shadow-lg">
                        <option value="W001" class="bg-[#0A0F1E] text-white">Simulate: Arun Kumar (W001)</option>
                        <option value="W002" class="bg-[#0A0F1E] text-white">Simulate: Sarah Chen (W002)</option>
                        <option value="W003" class="bg-[#0A0F1E] text-white">Simulate: Marcus Reed (W003)</option>
                    </select>
                `;
                headerContainer.appendChild(selectorWrapper);
            }

            const selector = document.getElementById('worker-selector');

            // Dynamic scan lifecycle
            let scanTimer1, scanTimer2;
            
            function startFaceScanCycle() {
                laserLine.classList.add('hidden');
                
                // 1. Wait 3 seconds, simulating scanner searching for face
                scanTimer1 = setTimeout(() => {
                    laserLine.classList.remove('hidden'); // Laser starts moving
                    
                    // 2. Wait 1.5 seconds, simulating bio-diagnostics processing
                    scanTimer2 = setTimeout(async () => {
                        laserLine.classList.add('hidden'); // Stop laser
                        
                        // Gather selected worker metadata
                        const selectedCode = selector ? selector.value : 'W001';
                        const workerObj = workersList.find(w => w.employeeCode === selectedCode) || workersList[0];

                        // Randomize Biometrics HUD details
                        const randTemp = (36.3 + Math.random() * 0.5).toFixed(1);
                        const randTime = (0.55 + Math.random() * 0.35).toFixed(2);
                        const randConfidence = Math.floor(95 + Math.random() * 5);

                        try {
                            const response = await window.famsApi.famsFetch('/attendance', {
                                method: 'POST',
                                body: JSON.stringify({
                                    employeeCode: workerObj.employeeCode,
                                    eventType: 'auto',
                                    method: 'face',
                                    confidence: randConfidence
                                })
                            });
                            console.log("Attendance logged successfully:", response);

                            // Determine status (check-in / check-out based on backend response, default to checked-in)
                            const isCheckOut = response.event && response.event.eventType === 'check-out';
                            const statusStr = isCheckOut ? 'Checked Out' : 'Checked In';

                            if (overlay && card) {
                                // Update Success Card biometric values
                                if (successAvatar) successAvatar.src = workerObj.avatar;
                                if (successName) successName.textContent = workerObj.name;
                                if (successBadgeText) successBadgeText.textContent = statusStr;
                                if (successTemp) successTemp.textContent = `TEMP: ${randTemp}°C`;
                                if (successTime) successTime.textContent = `MATCH: ${randTime}s`;
                                
                                const timeNow = new Date();
                                if (successTimestamp) {
                                    successTimestamp.textContent = timeNow.toLocaleTimeString('en-US', {
                                        hour: '2-digit',
                                        minute: '2-digit',
                                        second: '2-digit',
                                        hour12: true
                                    });
                                }

                                // Open success notification sheet
                                overlay.classList.remove('hidden');
                                overlay.classList.add('flex');
                                void overlay.offsetWidth; // Trigger reflow for CSS view transition
                                
                                overlay.classList.add('animate-fade-in-success');
                                card.classList.remove('scale-95', 'opacity-0');
                                card.classList.add('scale-100', 'opacity-100');

                                // Automatically reset sheet after 3 seconds and schedule next scan cycle
                                setTimeout(() => {
                                    overlay.classList.remove('animate-fade-in-success');
                                    overlay.classList.add('hidden');
                                    overlay.classList.remove('flex');
                                    card.classList.add('scale-95', 'opacity-0');
                                    card.classList.remove('scale-100', 'opacity-100');
                                    
                                    // Start next cycle immediately
                                    startFaceScanCycle();
                                }, 3000);
                            }
                        } catch (error) {
                            console.error("Biometric registration failure:", error);
                            alert("Kiosk Connection Error: " + error.message);
                            startFaceScanCycle(); // Restart cycle even on failures to keep kiosk alive
                        }
                    }, 1500);
                }, 3000);
            }

            // Start scanner cycle
            startFaceScanCycle();

            // When selected employee changes, cancel pending timers and restart cycle immediately for responsive simulation
            if (selector) {
                selector.addEventListener('change', () => {
                    clearTimeout(scanTimer1);
                    clearTimeout(scanTimer2);
                    startFaceScanCycle();
                });
            }
        });
    </script>
</body></html>
