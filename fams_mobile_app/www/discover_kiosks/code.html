<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Discover Kiosks - FAMS Mobile</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400&display=swap" rel="stylesheet"/>
<script>
tailwind.config = { darkMode: 'class', theme: { extend: { colors: { background: '#001019', primary: '#6dddff', 'on-surface': '#c7ebff', 'on-surface-variant': '#84b1ca', surface: '#001c28' }, fontFamily: { sans: ['Inter','system-ui','sans-serif'] } } } };
</script>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<style>body{font-family:Inter,system-ui,sans-serif}.glass{background:rgba(0,28,40,.6);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(12px)}</style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col">
<header class="h-16 flex items-center px-4 border-b border-white/10">
<button id="back-btn" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/5" aria-label="Back">
<span class="material-symbols-outlined text-on-surface-variant">arrow_back</span>
</button>
<h1 class="flex-1 text-center text-lg font-semibold text-primary -ml-10">Discover Kiosks</h1>
</header>
<main class="flex-1 flex flex-col items-center justify-center p-6 max-w-md mx-auto text-center gap-6">
<div class="w-20 h-20 rounded-2xl glass flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-4xl">bluetooth_disabled</span>
</div>
<h2 class="text-xl font-bold">Bluetooth discovery not available</h2>
<p class="text-sm text-on-surface-variant leading-relaxed">Pair this device with a 6-digit code from the FAMS web dashboard instead. Bluetooth kiosk discovery is planned for a future release.</p>
<button onclick="window.location.href='../device_pairing_setup_step_2/code.html'" class="w-full py-3.5 rounded-xl bg-primary text-[#004352] font-semibold">Pair with code</button>
<button onclick="window.location.href='../live_floor_dashboard/code.html'" class="w-full py-3 rounded-xl border border-white/15 text-on-surface-variant">Back to dashboard</button>
</main>
<script>
document.getElementById('back-btn').addEventListener('click', () => history.back());
if (!window.famsApi.hasServerConfigured()) window.location.href = '../server_setup/code.html';
</script>
</body>
</html>
