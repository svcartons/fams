# Standard Nginx top-level directives
user  nginx;
pid   /var/run/nginx.pid;

# =====================================================================
# FAMS — Nginx Configuration (Production Optimized)
# =====================================================================

# Tune Nginx worker processes for low-RAM containers
# auto = 1 worker per CPU core (usually 1 in Docker = 1 worker)
worker_processes auto;

# Max open files per worker. Keep low for small containers.
worker_rlimit_nofile 1024;

events {
    worker_connections 512;   # Max concurrent connections per worker
    use epoll;                # Most efficient I/O model on Linux
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Performance ──────────────────────────────────────────────────
    sendfile        on;   # OS-level file transfer (bypasses userspace)
    tcp_nopush      on;   # Batch TCP packets (reduces latency)
    tcp_nodelay     on;   # Disable Nagle algorithm for small packets
    keepalive_timeout 30; # Close idle connections after 30s (save RAM)
    keepalive_requests 100;

    # Tune buffer sizes for low-RAM containers
    client_body_buffer_size    16k;
    client_max_body_size       2m;  # Limit upload size (face descriptors are small)
    client_header_buffer_size  1k;
    large_client_header_buffers 2 4k;

    # ── Compression ──────────────────────────────────────────────────
    # Reduces JS bundle from ~1.4 MB to ~370 KB over the wire
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;    # Level 5 = best speed/size ratio (6 is slower)
    gzip_min_length   1000; # Don't compress tiny responses
    gzip_buffers      8 16k;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        image/svg+xml
        font/woff
        font/woff2;

    # ── Security Headers ─────────────────────────────────────────────
    server_tokens off;  # Hide Nginx version from error pages

    # ── Logging ──────────────────────────────────────────────────────
    # Log only errors in production to minimize disk I/O
    access_log off;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name _;  # Accept any hostname (good for LAN factory IPs)

        root /usr/share/nginx/html;
        index index.html;

        # ── Static Asset Caching ────────────────────────────────────
        # Vite generates content-hashed filenames (e.g., index-CMI11v-U.js)
        # so we can safely cache these FOREVER — they never change for the same hash
        location ~* \.(js|css|woff|woff2|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;
        }

        # Face recognition model weights — large, rarely change
        location /models/ {
            expires 7d;
            add_header Cache-Control "public";
        }

        # ── SPA Routing ─────────────────────────────────────────────
        # All non-file routes fall through to index.html (React Router)
        location / {
            try_files $uri $uri/ /index.html;
            add_header X-Frame-Options "SAMEORIGIN";
            add_header X-Content-Type-Options nosniff;
            add_header Referrer-Policy "strict-origin-when-cross-origin";
        }

        # ── Backend API Proxy ───────────────────────────────────────
        location /api/ {
            proxy_pass         http://backend:3001;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        "";  # Disable upgrade for standard API
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_buffering    off;   # Don't buffer API responses (reduces RAM)
        }

        # ── Error Pages ─────────────────────────────────────────────
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
        }
    }
}
